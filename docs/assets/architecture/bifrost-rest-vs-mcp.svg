<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="'Inter','IBM Plex Sans',system-ui,sans-serif">
  <defs>
    <!-- Column backgrounds -->
    <linearGradient id="restCol" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="mcpCol" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>

    <!-- Column headers -->
    <linearGradient id="restHeader" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="mcpHeader" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>

    <!-- Box fills -->
    <linearGradient id="boxFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Brand gradient -->
    <linearGradient id="bifrostBrand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    REST API  vs.  BIFRÖST MCP FRAMEWORK
  </text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#64748b">
    Two ways to give an LLM access to Grafana — Bifröst gives you both, on one server
  </text>

  <!-- VS divider -->
  <circle cx="700" cy="400" r="30" fill="url(#bifrostBrand)" filter="url(#glow)"/>
  <text x="700" y="408" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">VS</text>

  <!-- ═══════════════════════════════════════════ LEFT COLUMN: REST ═ -->
  <rect x="170" y="110" width="480" height="620" rx="20" fill="url(#restCol)" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="170" y="110" width="480" height="54" rx="20" fill="url(#restHeader)"/>
  <rect x="170" y="140" width="480" height="24" fill="url(#restHeader)"/>
  <text x="410" y="144" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Classic REST API</text>
  <text x="410" y="160" text-anchor="middle" font-size="11" fill="#bfdbfe">Hand-rolled wrapper per agent · no protocol standard</text>

  <!-- Browser / Script -->
  <g filter="url(#softShadow)">
    <rect x="215" y="200" width="390" height="72" rx="10" fill="url(#boxFill)" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="250" cy="236" r="18" fill="#3b82f6"/>
    <text x="250" y="243" text-anchor="middle" font-size="16" fill="#ffffff">💻</text>
    <text x="280" y="230" font-size="14" font-weight="700" fill="#0f172a">Browser / Script</text>
    <text x="280" y="246" font-size="11" fill="#64748b">GET /api/dashboards?tag=prod</text>
    <text x="280" y="260" font-size="11" fill="#64748b">Synchronous fetch · JSON response</text>
  </g>

  <!-- arrow down -->
  <line x1="410" y1="272" x2="410" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <g filter="url(#softShadow)">
    <rect x="215" y="308" width="390" height="72" rx="10" fill="url(#boxFill)" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="250" cy="344" r="18" fill="#0ea5e9"/>
    <text x="250" y="350" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">⚙</text>
    <text x="280" y="338" font-size="14" font-weight="700" fill="#0f172a">API Gateway</text>
    <text x="280" y="354" font-size="11" fill="#64748b">Auth · rate limit · CORS</text>
    <text x="280" y="368" font-size="11" fill="#64748b">One endpoint per verb, no introspection</text>
  </g>

  <line x1="410" y1="380" x2="410" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Microservices (shard) -->
  <g filter="url(#softShadow)">
    <rect x="215" y="416" width="124" height="80" rx="10" fill="url(#boxFill)" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="277" cy="442" r="14" fill="#6366f1"/>
    <text x="277" y="448" text-anchor="middle" font-size="12" fill="#ffffff">👤</text>
    <text x="277" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">User svc</text>
    <text x="277" y="488" text-anchor="middle" font-size="10" fill="#64748b">/api/users</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="348" y="416" width="124" height="80" rx="10" fill="url(#boxFill)" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="410" cy="442" r="14" fill="#ec4899"/>
    <text x="410" y="448" text-anchor="middle" font-size="12" fill="#ffffff">📊</text>
    <text x="410" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">DashSvc</text>
    <text x="410" y="488" text-anchor="middle" font-size="10" fill="#64748b">/api/dash</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="481" y="416" width="124" height="80" rx="10" fill="url(#boxFill)" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="543" cy="442" r="14" fill="#f59e0b"/>
    <text x="543" y="448" text-anchor="middle" font-size="12" fill="#ffffff">🔔</text>
    <text x="543" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">AlertSvc</text>
    <text x="543" y="488" text-anchor="middle" font-size="10" fill="#64748b">/api/alert</text>
  </g>

  <line x1="410" y1="496" x2="410" y2="524" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database -->
  <g filter="url(#softShadow)">
    <rect x="215" y="530" width="390" height="72" rx="10" fill="url(#boxFill)" stroke="#bfdbfe" stroke-width="1.5"/>
    <ellipse cx="250" cy="566" rx="18" ry="8" fill="#64748b"/>
    <rect x="232" y="558" width="36" height="16" fill="#64748b"/>
    <ellipse cx="250" cy="574" rx="18" ry="8" fill="#64748b"/>
    <text x="280" y="560" font-size="14" font-weight="700" fill="#0f172a">Grafana SQL + HTTP API</text>
    <text x="280" y="576" font-size="11" fill="#64748b">One URL per endpoint</text>
    <text x="280" y="590" font-size="11" fill="#64748b">Each agent re-wires integration</text>
  </g>

  <!-- REST column footer -->
  <g>
    <text x="410" y="645" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.1em">CHARACTERISTICS</text>
    <text x="410" y="668" text-anchor="middle" font-size="11" fill="#334155">General purpose · Structured data</text>
    <text x="410" y="684" text-anchor="middle" font-size="11" fill="#334155">Synchronous · Well-established</text>
    <text x="410" y="700" text-anchor="middle" font-size="11" fill="#334155">🔒 No built-in role model for LLMs</text>
    <text x="410" y="716" text-anchor="middle" font-size="11" fill="#334155">⚠ Every agent needs a custom integration</text>
  </g>

  <!-- ═══════════════════════════════════════════ RIGHT COLUMN: MCP ═ -->
  <rect x="750" y="110" width="480" height="620" rx="20" fill="url(#mcpCol)" stroke="#86efac" stroke-width="1.5"/>
  <rect x="750" y="110" width="480" height="54" rx="20" fill="url(#mcpHeader)"/>
  <rect x="750" y="140" width="480" height="24" fill="url(#mcpHeader)"/>
  <text x="990" y="144" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Bifröst MCP Framework</text>
  <text x="990" y="160" text-anchor="middle" font-size="11" fill="#d1fae5">Model Context Protocol · works with every MCP-capable agent</text>

  <!-- AI Agent -->
  <g filter="url(#softShadow)">
    <rect x="795" y="200" width="390" height="72" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="830" cy="236" r="18" fill="url(#bifrostBrand)" filter="url(#glow)"/>
    <text x="830" y="242" text-anchor="middle" font-size="16" fill="#ffffff">🤖</text>
    <text x="860" y="230" font-size="14" font-weight="700" fill="#0f172a">AI Agent</text>
    <text x="860" y="246" font-size="11" fill="#64748b">Claude · GPT · Cursor · VSCode · Built-in</text>
    <text x="860" y="260" font-size="11" fill="#64748b">Discovers the tool catalog at connect time</text>
  </g>

  <line x1="990" y1="272" x2="990" y2="300" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrowAccent)"/>

  <!-- Bifröst MCP Server -->
  <g filter="url(#softShadow)">
    <rect x="795" y="308" width="390" height="88" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="2"/>
    <rect x="795" y="308" width="8" height="88" rx="4" fill="url(#bifrostBrand)"/>
    <circle cx="840" cy="352" r="22" fill="url(#bifrostBrand)" filter="url(#glow)"/>
    <text x="840" y="358" text-anchor="middle" font-size="18" fill="#ffffff" font-weight="800">⧉</text>
    <text x="880" y="336" font-size="16" font-weight="800" fill="#0f172a">Bifröst MCP Server</text>
    <text x="880" y="354" font-size="11" fill="#64748b">SSE · streamable HTTP · stdio transports</text>
    <text x="880" y="370" font-size="11" fill="#64748b">16 typed tools · role enforcement · pooled httpx</text>
    <text x="880" y="386" font-size="11" fill="#64748b">Python 3.11+ · FastAPI · Pydantic v2 · structlog</text>
  </g>

  <!-- Data sources / tools -->
  <line x1="840" y1="396" x2="840" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="396" x2="990" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1140" y1="396" x2="1140" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="795" y="432" width="124" height="70" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="857" cy="458" r="14" fill="#06b6d4"/>
    <text x="857" y="464" text-anchor="middle" font-size="12" fill="#ffffff">📊</text>
    <text x="857" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Dashboards</text>
    <text x="857" y="495" text-anchor="middle" font-size="10" fill="#64748b">list · get · search</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="928" y="432" width="124" height="70" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="990" cy="458" r="14" fill="#8b5cf6"/>
    <text x="990" y="464" text-anchor="middle" font-size="12" fill="#ffffff">🔌</text>
    <text x="990" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Datasources</text>
    <text x="990" y="495" text-anchor="middle" font-size="10" fill="#64748b">list · query</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="1061" y="432" width="124" height="70" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="1123" cy="458" r="14" fill="#f59e0b"/>
    <text x="1123" y="464" text-anchor="middle" font-size="12" fill="#ffffff">🔔</text>
    <text x="1123" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Alerts</text>
    <text x="1123" y="495" text-anchor="middle" font-size="10" fill="#64748b">rules · silence</text>
  </g>

  <line x1="990" y1="502" x2="990" y2="524" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 envs row -->
  <g filter="url(#softShadow)">
    <rect x="795" y="530" width="124" height="70" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="857" cy="556" r="14" fill="#06b6d4"/>
    <text x="857" y="562" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">dev</text>
    <text x="857" y="580" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Grafana dev</text>
    <text x="857" y="592" text-anchor="middle" font-size="9" fill="#64748b">v/e/a tokens</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="928" y="530" width="124" height="70" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="990" cy="556" r="14" fill="#f59e0b"/>
    <text x="990" y="562" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">perf</text>
    <text x="990" y="580" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Grafana perf</text>
    <text x="990" y="592" text-anchor="middle" font-size="9" fill="#64748b">v/e/a tokens</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="1061" y="530" width="124" height="70" rx="10" fill="url(#boxFill)" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="1123" cy="556" r="14" fill="#ec4899"/>
    <text x="1123" y="562" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">prod</text>
    <text x="1123" y="580" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Grafana prod</text>
    <text x="1123" y="592" text-anchor="middle" font-size="9" fill="#64748b">v/e/a tokens</text>
  </g>

  <!-- MCP column footer -->
  <g>
    <text x="990" y="645" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46" letter-spacing="0.1em">CHARACTERISTICS</text>
    <text x="990" y="668" text-anchor="middle" font-size="11" fill="#334155">Model optimization · Agentic workflows</text>
    <text x="990" y="684" text-anchor="middle" font-size="11" fill="#334155">Typed tools · self-describing schemas</text>
    <text x="990" y="700" text-anchor="middle" font-size="11" fill="#334155">🛡 Role-aware (viewer · editor · admin)</text>
    <text x="990" y="716" text-anchor="middle" font-size="11" fill="#334155">🔌 One integration, every MCP-capable agent</text>
  </g>

  <!-- Side labels (left side) -->
  <g font-size="11" fill="#334155">
    <g transform="translate(40, 190)">
      <circle cx="20" cy="20" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#3b82f6">🌐</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#1e40af">HTTP/HTTPS</text>
      <text x="50" y="32" font-size="10" fill="#64748b">Stateless request/response</text>
    </g>
    <g transform="translate(40, 290)">
      <circle cx="20" cy="20" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#3b82f6">🔗</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#1e40af">Resource-based</text>
      <text x="50" y="32" font-size="10" fill="#64748b">URLs name things</text>
    </g>
    <g transform="translate(40, 390)">
      <circle cx="20" cy="20" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#3b82f6">🔑</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#1e40af">Stateless</text>
      <text x="50" y="32" font-size="10" fill="#64748b">No session state</text>
    </g>
    <g transform="translate(40, 490)">
      <circle cx="20" cy="20" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#3b82f6">🖥</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#1e40af">Client-Server</text>
      <text x="50" y="32" font-size="10" fill="#64748b">Classic architecture</text>
    </g>
  </g>

  <!-- Side labels (right side) -->
  <g font-size="11" fill="#334155">
    <g transform="translate(1270, 190)">
      <circle cx="20" cy="20" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#10b981">🧠</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#065f46">LLM-native</text>
      <text x="50" y="32" font-size="10" fill="#64748b">Tool catalog ↔ prompt</text>
    </g>
    <g transform="translate(1270, 290)">
      <circle cx="20" cy="20" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#10b981">⚙</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#065f46">Dynamic tool use</text>
      <text x="50" y="32" font-size="10" fill="#64748b">LLM picks tool at runtime</text>
    </g>
    <g transform="translate(1270, 390)">
      <circle cx="20" cy="20" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#10b981">🛡</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#065f46">Role-scoped</text>
      <text x="50" y="32" font-size="10" fill="#64748b">3 tokens per env</text>
    </g>
    <g transform="translate(1270, 490)">
      <circle cx="20" cy="20" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#10b981">🔄</text>
      <text x="50" y="18" font-size="11" font-weight="700" fill="#065f46">Stateful context</text>
      <text x="50" y="32" font-size="10" fill="#64748b">Multi-turn tool loops</text>
    </g>
  </g>

  <!-- Footer banner: Bifröst unifies both -->
  <rect x="170" y="755" width="1060" height="50" rx="12" fill="url(#bifrostBrand)" opacity="0.92" filter="url(#softShadow)"/>
  <text x="700" y="780" text-anchor="middle" font-size="14" font-weight="700" fill="#1a0a00">
    Bifröst gives you BOTH on one server — REST bridge for browsers &amp; scripts, MCP SSE for agents &amp; VSCode.
  </text>
  <text x="700" y="796" text-anchor="middle" font-size="11" fill="#1a0a00" opacity="0.8">
    Same 16 typed tools · same role enforcement · same pooled GrafanaClient — no bespoke integrations, no drift.
  </text>
</svg>
