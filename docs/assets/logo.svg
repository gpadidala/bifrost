<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="Bifröst logo">
  <defs>
    <linearGradient id="bridge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="25%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="75%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Rainbow arch -->
  <path d="M 20 55 Q 60 15 120 15 Q 180 15 220 55" fill="none" stroke="url(#bridge-grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Bridge deck -->
  <line x1="15" y1="58" x2="225" y2="58" stroke="#1e2333" stroke-width="3"/>
  <!-- Vertical supports -->
  <line x1="60"  y1="30" x2="60"  y2="58" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="90"  y1="22" x2="90"  y2="58" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="120" y1="19" x2="120" y2="58" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="150" y1="22" x2="150" y2="58" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="180" y1="30" x2="180" y2="58" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Text -->
  <text x="28" y="75" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="700" letter-spacing="2" fill="url(#text-grad)">Bif</text>
  <text x="64" y="75" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#e2e8f0">r</text>
  <text x="74" y="73" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="6" fill="#e2e8f0">ö</text>
  <text x="80" y="75" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#e2e8f0">st</text>
  <!-- Tagline dot -->
  <circle cx="118" cy="72" r="2" fill="#f59e0b"/>
</svg>
