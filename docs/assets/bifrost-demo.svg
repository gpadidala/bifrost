<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Bifröst demo walkthrough">
  <rect width="900" height="400" fill="#0d0d12"/>
  <!-- Header bar -->
  <rect width="900" height="48" fill="#111827"/>
  <rect width="900" height="1" y="48" fill="#1e2333"/>
  <!-- Traffic lights -->
  <circle cx="24" cy="24" r="7" fill="#ef4444"/>
  <circle cx="44" cy="24" r="7" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="7" fill="#22c55e"/>
  <!-- Title -->
  <text x="450" y="29" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Bifröst — Grafana MCP Server</text>
  <!-- Role badge -->
  <rect x="780" y="12" width="100" height="24" rx="12" fill="#1e2333"/>
  <circle cx="795" cy="24" r="5" fill="#22c55e"/>
  <text x="825" y="28" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#22c55e">viewer</text>
  <!-- Left sidebar -->
  <rect x="0" y="49" width="200" height="351" fill="#0f1117"/>
  <rect x="200" y="49" width="1" height="351" fill="#1e2333"/>
  <!-- Sidebar items -->
  <rect x="10" y="70" width="180" height="36" rx="6" fill="#1e2333"/>
  <text x="50" y="93" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#f59e0b">● Connection</text>
  <text x="50" y="128" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#64748b">○ AI Chat</text>
  <text x="50" y="163" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#64748b">○ Explorer</text>
  <text x="50" y="198" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#64748b">○ LLM Config</text>
  <!-- Env tabs -->
  <rect x="210" y="60" width="60" height="28" rx="4" fill="#f59e0b"/>
  <text x="240" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d0d12" text-anchor="middle" font-weight="700">dev</text>
  <rect x="278" y="60" width="60" height="28" rx="4" fill="#1e2333"/>
  <text x="308" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">perf</text>
  <rect x="346" y="60" width="60" height="28" rx="4" fill="#1e2333"/>
  <text x="376" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">prod</text>
  <!-- Main content area: connection form -->
  <rect x="210" y="100" width="680" height="300" rx="8" fill="#111827"/>
  <rect x="210" y="100" width="680" height="300" rx="8" stroke="#1e2333" stroke-width="1" fill="none"/>
  <!-- Form fields -->
  <text x="232" y="135" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#94a3b8">Grafana URL</text>
  <rect x="232" y="142" width="300" height="32" rx="6" fill="#0d0d12" stroke="#1e2333" stroke-width="1"/>
  <text x="244" y="163" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">http://localhost:3000</text>
  <text x="232" y="200" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#94a3b8">Service Account Token (viewer)</text>
  <rect x="232" y="207" width="300" height="32" rx="6" fill="#0d0d12" stroke="#1e2333" stroke-width="1"/>
  <text x="244" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">glsa_dev_viewer_••••••••••••</text>
  <!-- Health status -->
  <rect x="232" y="260" width="640" height="44" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <circle cx="252" cy="282" r="6" fill="#22c55e"/>
  <text x="266" y="286" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" fill="#22c55e" font-weight="600">Grafana reachable — database: ok  •  version 11.4.0  •  12 ms</text>
  <!-- Step annotations -->
  <circle cx="330" cy="142" r="16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="358" y="138" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#f59e0b">① Enter Grafana URL</text>
  <text x="358" y="218" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#f59e0b">② Paste service-account token</text>
  <text x="358" y="286" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#22c55e">③ Health check passes — ready!</text>
</svg>
