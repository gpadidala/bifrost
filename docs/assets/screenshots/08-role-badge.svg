<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="Role selector badges">
  <rect width="560" height="420" fill="#0d0d12"/>
  <rect width="560" height="40" fill="#111827"/>
  <rect width="560" height="1" y="40" fill="#1e2333"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#22c55e"/>
  <text x="280" y="25" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Role Selector</text>
  <!-- Section title -->
  <text x="20" y="74" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="13" fill="#94a3b8" font-weight="600">Active Role</text>
  <text x="20" y="92" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#475569">Controls which Grafana service-account token is used for all MCP tool calls.</text>
  <!-- Role cards -->
  <!-- Viewer (active) -->
  <rect x="20" y="108" width="160" height="100" rx="10" fill="#111827" stroke="#22c55e" stroke-width="2"/>
  <circle cx="50" cy="135" r="12" fill="#052e16"/>
  <circle cx="50" cy="135" r="6" fill="#22c55e"/>
  <text x="68" y="132" font-family="'JetBrains Mono',monospace" font-size="14" fill="#22c55e" font-weight="700">viewer</text>
  <text x="36" y="152" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#64748b">Read-only access</text>
  <text x="36" y="168" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#475569">• list dashboards</text>
  <text x="36" y="182" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#475569">• get alerts</text>
  <rect x="32" y="192" width="136" height="8" rx="4" fill="#052e16"/>
  <text x="100" y="199" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">ACTIVE</text>
  <!-- Editor -->
  <rect x="196" y="108" width="160" height="100" rx="10" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <circle cx="226" cy="135" r="12" fill="#1e2333"/>
  <circle cx="226" cy="135" r="6" fill="#f59e0b" opacity="0.5"/>
  <text x="244" y="132" font-family="'JetBrains Mono',monospace" font-size="14" fill="#94a3b8" font-weight="700">editor</text>
  <text x="212" y="152" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#475569">Read + silence alerts</text>
  <text x="212" y="168" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#334155">• silence_alert</text>
  <text x="212" y="182" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#334155">• + all viewer tools</text>
  <!-- Admin -->
  <rect x="372" y="108" width="168" height="100" rx="10" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <circle cx="402" cy="135" r="12" fill="#1e2333"/>
  <circle cx="402" cy="135" r="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="420" y="132" font-family="'JetBrains Mono',monospace" font-size="14" fill="#94a3b8" font-weight="700">admin</text>
  <text x="388" y="152" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#475569">Full management access</text>
  <text x="388" y="168" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#334155">• list_users</text>
  <text x="388" y="182" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#334155">• list_service_accounts</text>
  <!-- Role in header bar mockup -->
  <text x="20" y="242" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#64748b">Header badge (visible in every view):</text>
  <rect x="20" y="252" width="520" height="48" rx="8" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <text x="36" y="281" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Bifröst</text>
  <!-- env badge -->
  <rect x="380" y="262" width="52" height="22" rx="11" fill="#1e2333"/>
  <text x="406" y="277" font-family="'JetBrains Mono',monospace" font-size="10" fill="#f59e0b" text-anchor="middle">dev</text>
  <!-- role badge -->
  <rect x="440" y="262" width="88" height="22" rx="11" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <circle cx="455" cy="273" r="4" fill="#22c55e"/>
  <text x="476" y="277" font-family="'JetBrains Mono',monospace" font-size="10" fill="#22c55e">viewer</text>
  <!-- Permission matrix -->
  <text x="20" y="326" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#64748b">Permission matrix:</text>
  <rect x="20" y="334" width="520" height="72" rx="6" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <text x="36" y="354" font-family="'JetBrains Mono',monospace" font-size="10" fill="#475569">Tool               viewer  editor  admin</text>
  <text x="36" y="370" font-family="'JetBrains Mono',monospace" font-size="10" fill="#475569">list_dashboards      <tspan fill="#22c55e">✓</tspan>       <tspan fill="#22c55e">✓</tspan>       <tspan fill="#22c55e">✓</tspan></text>
  <text x="36" y="386" font-family="'JetBrains Mono',monospace" font-size="10" fill="#475569">silence_alert        <tspan fill="#ef4444">✗</tspan>       <tspan fill="#22c55e">✓</tspan>       <tspan fill="#22c55e">✓</tspan></text>
  <text x="36" y="402" font-family="'JetBrains Mono',monospace" font-size="10" fill="#475569">list_users           <tspan fill="#ef4444">✗</tspan>       <tspan fill="#ef4444">✗</tspan>       <tspan fill="#22c55e">✓</tspan></text>
</svg>
