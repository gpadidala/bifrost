<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Bifröst launch splash">
  <rect width="900" height="500" fill="#0d0d12"/>
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2333" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#ef4444"/>
      <stop offset="25%"  style="stop-color:#f59e0b"/>
      <stop offset="50%"  style="stop-color:#22c55e"/>
      <stop offset="75%"  style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#grid)"/>
  <!-- Rainbow arch -->
  <path d="M 150 320 Q 450 80 750 320" fill="none" stroke="url(#rainbow)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Bridge deck -->
  <rect x="140" y="324" width="620" height="6" rx="3" fill="#1e2333"/>
  <!-- Vertical cables -->
  <line x1="225" y1="190" x2="225" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="300" y1="152" x2="300" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="375" y1="132" x2="375" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="450" y1="125" x2="450" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="525" y1="132" x2="525" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="600" y1="152" x2="600" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="675" y1="190" x2="675" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Title -->
  <text x="450" y="390" font-family="'JetBrains Mono','Fira Code',monospace" font-size="52" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">Bifröst</text>
  <!-- Tagline -->
  <text x="450" y="425" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#64748b" text-anchor="middle">The rainbow bridge between LLMs and Grafana</text>
  <!-- Version badge -->
  <rect x="398" y="445" width="104" height="28" rx="14" fill="#1e2333"/>
  <text x="450" y="464" font-family="'JetBrains Mono',monospace" font-size="12" fill="#f59e0b" text-anchor="middle">v1.3.0  ●  MCP</text>
  <!-- Bottom badges -->
  <rect x="200" y="480" width="100" height="12" rx="6" fill="#1e2333" opacity="0.6"/>
  <rect x="310" y="480" width="80" height="12" rx="6" fill="#1e2333" opacity="0.6"/>
  <rect x="400" y="480" width="100" height="12" rx="6" fill="#1e2333" opacity="0.6"/>
  <rect x="510" y="480" width="80" height="12" rx="6" fill="#1e2333" opacity="0.6"/>
  <rect x="600" y="480" width="100" height="12" rx="6" fill="#1e2333" opacity="0.6"/>
</svg>
