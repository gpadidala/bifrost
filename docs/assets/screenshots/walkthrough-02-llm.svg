  <text x="396" y="242" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#6b7280">SYSTEM PROMPT</text>
  <rect x="396" y="248" width="148" height="52" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="406" y="256" width="110" height="4" rx="2" fill="#374151" opacity="0.6"/>
