<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="VSCode MCP extension integration">
  <rect width="560" height="420" fill="#1e1e1e"/>
  <!-- VSCode title bar -->
  <rect width="560" height="30" fill="#323233"/>
  <circle cx="16" cy="15" r="6" fill="#ef4444"/>
  <circle cx="32" cy="15" r="6" fill="#f59e0b"/>
  <circle cx="48" cy="15" r="6" fill="#22c55e"/>
  <text x="280" y="20" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">mcp.json — bifrost</text>
  <!-- Activity bar -->
  <rect x="0" y="30" width="48" height="390" fill="#333333"/>
  <text x="24" y="64" font-family="monospace" font-size="18" fill="#858585" text-anchor="middle">⬚</text>
  <text x="24" y="104" font-family="monospace" font-size="18" fill="#858585" text-anchor="middle">⚙</text>
  <rect x="0" y="114" width="4" height="24" rx="2" fill="#0098ff"/>
  <text x="24" y="144" font-family="monospace" font-size="18" fill="#cccccc" text-anchor="middle">🔌</text>
  <!-- Sidebar -->
  <rect x="48" y="30" width="200" height="390" fill="#252526"/>
  <rect x="248" y="30" width="1" height="390" fill="#444"/>
  <text x="64" y="54" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#bbb" letter-spacing="1" font-weight="600">MCP SERVERS</text>
  <!-- Server entries -->
  <rect x="52" y="62" width="192" height="28" rx="3" fill="#37373d"/>
  <circle cx="68" cy="76" r="5" fill="#22c55e"/>
  <text x="80" y="80" font-family="'JetBrains Mono',monospace" font-size="11" fill="#cccccc">grafana-dev-viewer</text>
  <circle cx="68" cy="104" r="5" fill="#22c55e"/>
  <text x="80" y="108" font-family="'JetBrains Mono',monospace" font-size="11" fill="#858585">grafana-dev-editor</text>
  <circle cx="68" cy="132" r="5" fill="#858585"/>
  <text x="80" y="136" font-family="'JetBrains Mono',monospace" font-size="11" fill="#858585">grafana-perf-viewer</text>
  <circle cx="68" cy="160" r="5" fill="#858585"/>
  <text x="80" y="164" font-family="'JetBrains Mono',monospace" font-size="11" fill="#858585">grafana-prod-admin</text>
  <!-- Main editor: mcp.json -->
  <rect x="249" y="30" width="311" height="390" fill="#1e1e1e"/>
  <!-- Line numbers + code -->
  <text x="260" y="54" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">1</text>
  <text x="280" y="54" font-family="'JetBrains Mono',monospace" font-size="10" fill="#ce9178">{</text>
  <text x="260" y="70" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">2</text>
  <text x="280" y="70" font-family="'JetBrains Mono',monospace" font-size="10" fill="#9cdcfe">  "servers"</text><text x="352" y="70" font-family="'JetBrains Mono',monospace" font-size="10" fill="#d4d4d4">: {</text>
  <text x="260" y="86" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">3</text>
  <text x="280" y="86" font-family="'JetBrains Mono',monospace" font-size="10" fill="#9cdcfe">    "grafana-dev-viewer"</text><text x="430" y="86" font-family="'JetBrains Mono',monospace" font-size="10" fill="#d4d4d4">: {</text>
  <text x="260" y="102" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">4</text>
  <text x="280" y="102" font-family="'JetBrains Mono',monospace" font-size="10" fill="#9cdcfe">      "url"</text><text x="325" y="102" font-family="'JetBrains Mono',monospace" font-size="10" fill="#d4d4d4">: </text><text x="337" y="102" font-family="'JetBrains Mono',monospace" font-size="10" fill="#ce9178">"http://localhost:8765/mcp/sse"</text>
  <text x="260" y="118" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">5</text>
  <text x="280" y="118" font-family="'JetBrains Mono',monospace" font-size="10" fill="#d4d4d4">    }</text>
  <text x="260" y="134" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">6</text>
  <text x="280" y="134" font-family="'JetBrains Mono',monospace" font-size="10" fill="#d4d4d4">  }</text>
  <text x="260" y="150" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">7</text>
  <text x="280" y="150" font-family="'JetBrains Mono',monospace" font-size="10" fill="#ce9178">}</text>
  <!-- Tool panel -->
  <rect x="249" y="200" width="311" height="220" fill="#252526"/>
  <rect x="249" y="200" width="311" height="1" fill="#444"/>
  <text x="264" y="220" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#bbb" letter-spacing="1">MCP TOOLS  <tspan fill="#22c55e">● Connected</tspan></text>
  <text x="264" y="244" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">list_dashboards</text>
  <text x="264" y="260" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">get_dashboard</text>
  <text x="264" y="276" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">search_dashboards</text>
  <text x="264" y="292" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">list_datasources</text>
  <text x="264" y="308" font-family="'JetBrains Mono',monospace" font-size="10" fill="#858585">health_check</text>
  <text x="264" y="324" font-family="'JetBrains Mono',monospace" font-size="10" fill="#475569">+ 11 more tools…</text>
  <!-- Status bar -->
  <rect x="0" y="400" width="560" height="20" fill="#0098ff"/>
  <text x="56" y="414" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="white">Bifröst MCP  ●  grafana-dev-viewer  ●  16 tools</text>
</svg>
