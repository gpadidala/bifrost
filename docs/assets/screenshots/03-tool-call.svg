<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360">
  <rect width="560" height="360" rx="8" fill="#0d0d12"/>
  <rect width="560" height="36" rx="8" fill="#0f172a"/>
  <rect y="28" width="560" height="8" fill="#0f172a"/>
  <circle cx="18" cy="18" r="5.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="18" r="5.5" fill="#eab308" opacity="0.8"/>
  <circle cx="54" cy="18" r="5.5" fill="#22c55e" opacity="0.8"/>
  <text x="280" y="22" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#6b7280">Bifr&#246;st &#8212; Tool Call Card</text>
  <!-- Sidebar -->
  <rect x="0" y="36" width="52" height="324" fill="#080d18"/>
  <rect x="14" y="136" width="24" height="3" rx="1.5" fill="#F46800" opacity="0.8"/>
  <!-- Expanded tool call card -->
  <rect x="68" y="55" width="468" height="160" rx="8" fill="#111827" stroke="#F46800" stroke-width="1.5"/>
  <!-- Card header -->
  <rect x="68" y="55" width="468" height="38" rx="8" fill="#1a0e00"/>
  <rect x="68" y="75" width="468" height="18" fill="#1a0e00"/>
  <!-- Tool icon -->
  <rect x="82" y="65" width="18" height="18" rx="3" fill="#F46800" opacity="0.3"/>
  <rect x="86" y="69" width="10" height="10" rx="1" fill="#F46800" opacity="0.6"/>
  <!-- Tool name -->
  <text x="110" y="78" font-family="monospace,Courier,sans-serif" font-size="13" font-weight="700" fill="#F46800">list_dashboards</text>
  <!-- Role badge -->
  <rect x="380" y="64" width="50" height="18" rx="9" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.8"/>
  <text x="405" y="76" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#22c55e">viewer</text>
  <!-- Params section -->
  <text x="84" y="114" font-family="monospace,Courier,sans-serif" font-size="10" fill="#6b7280">params:</text>
  <text x="110" y="128" font-family="monospace,Courier,sans-serif" font-size="10" fill="#9ca3af">folder_uid: </text>
  <text x="200" y="128" font-family="monospace,Courier,sans-serif" font-size="10" fill="#22c55e">"general"</text>
  <!-- Result section -->
  <text x="84" y="148" font-family="monospace,Courier,sans-serif" font-size="10" fill="#6b7280">result: </text>
  <text x="130" y="148" font-family="monospace,Courier,sans-serif" font-size="10" fill="#3b82f6">7 dashboards</text>
  <rect x="84" y="156" width="300" height="4" rx="2" fill="#1f2937"/>
  <rect x="84" y="165" width="220" height="4" rx="2" fill="#1f2937"/>
  <rect x="84" y="174" width="260" height="4" rx="2" fill="#1f2937"/>
  <!-- Central title + badge -->
  <text x="306" y="260" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">Tool Call Visualization</text>
  <text x="306" y="284" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6b7280">Collapsible &#xB7; Tool name &#xB7; Params &#xB7; Result</text>
  <rect x="196" y="300" width="220" height="28" rx="14" fill="#1a0e00" stroke="#F46800" stroke-width="1" opacity="0.8"/>
  <text x="306" y="318" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="0.5" fill="#F46800">SCREENSHOT PLACEHOLDER</text>
</svg>
