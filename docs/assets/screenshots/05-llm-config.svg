<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360">
  <rect width="560" height="360" rx="8" fill="#0d0d12"/>
  <rect width="560" height="36" rx="8" fill="#0f172a"/>
  <rect y="28" width="560" height="8" fill="#0f172a"/>
  <circle cx="18" cy="18" r="5.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="18" r="5.5" fill="#eab308" opacity="0.8"/>
  <circle cx="54" cy="18" r="5.5" fill="#22c55e" opacity="0.8"/>
  <text x="280" y="22" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#6b7280">Bifr&#246;st &#8212; LLM Config</text>
