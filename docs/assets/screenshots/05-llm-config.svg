  <rect x="52" y="36" width="360" height="324" fill="#0d0d12" opacity="0.5"/>
  <!-- Drawer panel (slides in from right) -->
  <rect x="400" y="36" width="160" height="324" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="480" y="62" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">LLM Settings</text>
  <!-- Provider row -->
  <text x="416" y="86" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#6b7280">PROVIDER</text>
  <rect x="416" y="92" width="128" height="20" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="428" y="106" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#f1f5f9">Anthropic &#x25BE;</text>
  <!-- Model row -->
  <text x="416" y="128" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#6b7280">MODEL</text>
  <rect x="416" y="134" width="128" height="20" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="428" y="148" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#f1f5f9">claude-sonnet &#x25BE;</text>
  <!-- API Key row -->
  <text x="416" y="170" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#6b7280">API KEY</text>
  <rect x="416" y="176" width="128" height="20" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="428" y="190" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#374151">sk-ant-&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;</text>
  <!-- System prompt row -->
  <text x="416" y="212" font-family="system-ui,Arial,sans-serif" font-size="9" fill="#6b7280">SYSTEM PROMPT</text>
  <rect x="416" y="218" width="128" height="56" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="424" y="226" width="100" height="4" rx="2" fill="#374151" opacity="0.6"/>
  <rect x="424" y="234" width="84" height="4" rx="2" fill="#374151" opacity="0.4"/>
  <rect x="424" y="242" width="92" height="4" rx="2" fill="#374151" opacity="0.3"/>
  <!-- Save button -->
  <rect x="416" y="290" width="128" height="28" rx="14" fill="#F46800"/>
  <text x="480" y="308" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="600" fill="white">Save</text>
  <!-- Central title + badge -->
  <text x="226" y="185" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="600" fill="#f1f5f9">LLM Config Drawer</text>
  <text x="226" y="208" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#6b7280">Provider &#xB7; Model &#xB7; System Prompt</text>
