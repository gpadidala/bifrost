<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="AI Chat interface">
  <rect width="560" height="420" fill="#0d0d12"/>
  <rect width="560" height="40" fill="#111827"/>
  <rect width="560" height="1" y="40" fill="#1e2333"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#22c55e"/>
  <text x="280" y="25" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">AI Chat — dev / viewer</text>
  <!-- Chat messages -->
  <!-- User message 1 -->
  <rect x="180" y="56" width="364" height="56" rx="8" fill="#1e3a5f"/>
  <text x="196" y="76" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#93c5fd">List all dashboards in the Infra folder</text>
  <text x="196" y="96" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#475569">You  •  12:34</text>
  <!-- Assistant message 1 -->
  <rect x="16" y="124" width="400" height="88" rx="8" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <text x="32" y="144" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#e2e8f0">I'll query the Grafana API for you.</text>
  <!-- Tool call pill -->
  <rect x="32" y="152" width="180" height="24" rx="12" fill="#1e2333"/>
  <text x="44" y="168" font-family="'JetBrains Mono',monospace" font-size="10" fill="#f59e0b">⚙ list_dashboards(folder="Infra")</text>
  <text x="32" y="200" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#94a3b8">Claude  •  12:34</text>
  <!-- Assistant message 2 -->
  <rect x="16" y="224" width="430" height="100" rx="8" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <text x="32" y="244" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#e2e8f0">Found 3 dashboards in Infra:</text>
  <text x="32" y="262" font-family="'JetBrains Mono',monospace" font-size="11" fill="#22c55e">• CPU Overview  (uid: cpu-01)</text>
  <text x="32" y="279" font-family="'JetBrains Mono',monospace" font-size="11" fill="#22c55e">• Memory Usage (uid: mem-02)</text>
  <text x="32" y="296" font-family="'JetBrains Mono',monospace" font-size="11" fill="#22c55e">• Disk I/O     (uid: disk-03)</text>
  <text x="32" y="314" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#94a3b8">Claude  •  12:34</text>
  <!-- User message 2 -->
  <rect x="200" y="336" width="344" height="44" rx="8" fill="#1e3a5f"/>
  <text x="216" y="356" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#93c5fd">Show me the panels in CPU Overview</text>
  <text x="216" y="372" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="10" fill="#475569">You  •  12:35</text>
  <!-- Input bar -->
  <rect x="16" y="390" width="528" height="22" rx="11" fill="#111827" stroke="#1e2333" stroke-width="1"/>
  <text x="32" y="405" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#334155">Ask about your Grafana instance…</text>
  <rect x="526" y="393" width="14" height="16" rx="3" fill="#f59e0b" opacity="0.7"/>
</svg>
