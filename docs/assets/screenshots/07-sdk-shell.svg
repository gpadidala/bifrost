  <text x="80" y="300" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e2e8f0">result = await client.query_datasource(</text>
  <text x="80" y="316" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e2e8f0">    <tspan fill="#22c55e">"prom-1"</tspan>, <tspan fill="#22c55e">"rate(http_requests_total[5m])"</tspan></text>
  <text x="80" y="332" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e2e8f0">)</text>
