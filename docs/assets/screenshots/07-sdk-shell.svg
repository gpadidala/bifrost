  <text x="20" y="252" font-family="'JetBrains Mono',monospace" font-size="12" fill="#f59e0b">In [3]: </text>
  <text x="80" y="252" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e2e8f0">health = await client.get_health()</text>
