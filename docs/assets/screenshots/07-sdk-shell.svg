  <text x="20" y="204" font-family="'JetBrains Mono',monospace" font-size="12" fill="#f59e0b">In [2]: </text>
  <text x="80" y="204" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e2e8f0">len(dashboards)</text>
