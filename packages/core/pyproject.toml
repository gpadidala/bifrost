[project]
name = "grafana-mcp-core"
version = "1.3.0"
description = "Bifröst core — multi-transport, multi-role, multi-environment MCP server for Grafana"
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Gopal Rao", email = "gopalpadiala@gmail.com" }]

dependencies = [
    "mcp[cli]>=1.6",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.4",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "click>=8.1",
    "starlette>=0.41",
    "uvicorn[standard]>=0.30",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
grafana-mcp = "grafana_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_mcp"]
