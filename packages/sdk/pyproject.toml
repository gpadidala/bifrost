[project]
name = "grafana-mcp-sdk"
version = "1.3.0"
description = "Bifröst SDK — high-level Python client for the Grafana MCP server"
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Gopal Rao", email = "gopalpadiala@gmail.com" }]

dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_mcp_sdk"]
